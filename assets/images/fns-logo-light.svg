<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64" fill="none">
  <defs>
    <linearGradient id="textGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="fnsGradLogoL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>
  <!-- Symbol -->
  <g transform="translate(6, 4) scale(0.875)">
    
  <defs>
    <linearGradient id="fnsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="fnsGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Hexagon Border -->
  <polygon points="32,4 56,18 56,46 32,60 8,46 8,18" stroke="url(#fnsGrad)" stroke-width="2.5" fill="#0B132B" fill-opacity="0.85" />
  <!-- Circuit Nodes & Lines -->
  <circle cx="32" cy="18" r="3" fill="#38BDF8" />
  <circle cx="18" cy="40" r="3" fill="#38BDF8" />
  <circle cx="46" cy="40" r="3" fill="#38BDF8" />
  <path d="M32 18 L18 40 M32 18 L46 40 M18 40 L46 40" stroke="url(#fnsGlow)" stroke-width="1.5" stroke-dasharray="2 2" />
  <!-- Center Emblem: Stylized F N S Letters / Network Core -->
  <polygon points="32,24 40,29 40,39 32,44 24,39 24,29" fill="url(#fnsGrad)" />
  <circle cx="32" cy="34" r="2.5" fill="#FFFFFF" />
  <!-- Pulse Accent -->
  <circle cx="32" cy="4" r="2" fill="#60A5FA" filter="url(#glow)"/>
  <circle cx="56" cy="18" r="2" fill="#38BDF8" filter="url(#glow)"/>
  <circle cx="56" cy="46" r="2" fill="#60A5FA" filter="url(#glow)"/>
  <circle cx="32" cy="60" r="2" fill="#38BDF8" filter="url(#glow)"/>
  <circle cx="8" cy="46" r="2" fill="#60A5FA" filter="url(#glow)"/>
  <circle cx="8" cy="18" r="2" fill="#38BDF8" filter="url(#glow)"/>

  </g>
  <!-- Divider -->
  <line x1="70" y1="14" x2="70" y2="50" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round" />
  <!-- Text -->
  <text x="82" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="900" letter-spacing="1" fill="#0F172A">
    FNS
  </text>
  <text x="140" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="url(#textGradLight)">
    NETWORK
  </text>
  <text x="82" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" letter-spacing="1.2" fill="#475569">
    FAIZAN NETWORK SOLUTION
  </text>
</svg>